version: "3.9"

services:
  frontend:
    build:
      context: ./FrontEnd
    ports:
      - "5173:80"
    networks:
      - fe-be-network
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./BackEnd
    ports:
      - "3000:3000"
    networks:
      - fe-be-network
      - be-db-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://localhost:5173

  db:
    image: postgres:16-alpine
    networks:
      - be-db-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spendly"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  fe-be-network:
    driver: bridge
  be-db-network:
    driver: bridge

volumes:
  postgres_data:
    name: spendly_postgres_data