<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Modal</title>

    <link rel="stylesheet" href="./style.css">
</head>
<body>

<button class="open-modal-btn">Open Recipe</button>

<div class="modal" id="modal">
  <div class="modal__overlay"></div>

  <div class="modal__content">
    <div class="modal__header">
      <h2 class="modal__title">Recipe Title</h2>
      <button class="modal__close">&times;</button>
    </div>

    <div class="modal__body">
      <img src="../JuiceDaily/img/latest_1.png" alt="recipe" class="modal__image">

      <div class="modal__info">
        <p class="modal__meta">Italian • Easy • 25 min • ⭐ 4.8</p>

        <div class="modal__section">
          <h4>Ingredients</h4>
          <ul>
            <li>Tomatoes</li>
            <li>Cheese</li>
            <li>Basil</li>
          </ul>
        </div>

        <div class="modal__section">
          <h4>Instructions</h4>
          <p>Mix ingredients and cook for 20 minutes...</p>
        </div>
      </div>
    </div>
  </div>
</div>


  <script src="./main.js"></script>
  <!-- Bootstrap JS -->
  <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script> -->

</body>
</html>
